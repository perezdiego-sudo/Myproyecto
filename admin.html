<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Quimiaseo y Perfumería del Caribe</title>
  
  <!-- Iconos FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tipografías oficiales del Catálogo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* PALETA DE COLORES OSCURA - ESTILO CATÁLOGO ONLINE */
      --bg-page: #0b1736;             /* Fondo azul marino profundo */
      --card-bg: #112042;             /* Fondo de tarjetas principales */
      --card-inner-bg: #0c1833;       /* Fondo interno / cajas de inputs */
      --header-bg: #0f1c3f;           /* Fondo del header flotante */
      --brand-blue: #2563eb;          /* Azul primario vibrante */
      --brand-blue-hover: #1d4ed8;    /* Azul hover */
      --brand-light-blue: #3b82f6;    /* Subtítulo azul brillante */
      --brand-dark: #070e20;          /* Tono marino extra oscuro */
      --text-main: #ffffff;           /* Texto principal blanco */
      --text-muted: #94a3b8;          /* Texto secundario / gris azulado */
      --border-color: rgba(255, 255, 255, 0.08); /* Borde sutil de tarjetas */
      --border-input: #1f3461;        /* Borde para campos de texto */
      --input-bg: #09132b;            /* Fondo para inputs y selects */
      
      --badge-blue-bg: #2563eb;
      --badge-blue-txt: #ffffff;
      --badge-red-bg: #7f1d1d;
      --badge-red-txt: #f87171;
      
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.4);
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Poppins', sans-serif;
      --radius-pill: 50px;
      --radius-card: 16px;
      --radius-input: 10px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
    }

    /* ENCABEZADO SUPERIOR FLOTANTE - IDÉNTICO AL CATÁLOGO ONLINE */
    .header-container {
      width: calc(100% - 32px);
      max-width: 1120px;
      margin: 16px auto 0 auto;
      background-color: var(--header-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      position: sticky;
      top: 16px;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: white;
      min-width: 0;
    }

    .brand-logo {
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-hover));
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.05rem;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-title {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: clamp(0.82rem, 2.5vw, 1.05rem);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--brand-light-blue);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-inicio {
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-inicio:hover {
      background-color: var(--brand-blue);
      border-color: var(--brand-blue);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #user-email {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.82rem;
      background-color: rgba(0, 0, 0, 0.25);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-color);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-logout {
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.82rem;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout:hover, .btn-logout:active {
      background-color: #dc2626;
      border-color: #dc2626;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1120px;
      margin: 28px auto;
      padding: 0 16px;
    }

    /* TITULAR SECCIÓN */
    .page-title {
      text-align: center;
      color: #ffffff;
      font-family: var(--font-heading);
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 800;
      margin-bottom: 28px;
      word-break: break-word;
    }

    /* CONTENEDOR LOGIN */
    .login-container {
      width: 100%;
      max-width: 420px;
      margin: 40px auto;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      padding: 32px 24px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }

    .login-title {
      text-align: center;
      color: #ffffff;
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-title i {
      color: var(--brand-blue);
    }

    /* TARJETAS DEL PANEL */
    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      padding: 24px 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      width: 100%;
      overflow: hidden;
    }

    .card-title {
      font-family: var(--font-heading);
      font-size: clamp(1.1rem, 3.5vw, 1.3rem);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
      word-break: break-word;
    }

    .card-title i {
      color: var(--brand-blue);
    }

    /* FORMULARIOS E INPUTS OSCUROS */
    .form-row {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .form-group {
      margin-bottom: 14px;
      width: 100%;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      max-width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      border: 1.5px solid var(--border-input);
      border-radius: var(--radius-input);
      font-family: var(--font-body);
      font-size: 0.9rem;
      background-color: var(--input-bg);
      color: #ffffff;
      transition: all 0.2s ease;
    }

    .form-group select option {
      background-color: var(--card-bg);
      color: #ffffff;
    }

    .form-group textarea {
      min-height: 80px;
      border-radius: var(--radius-input);
      resize: vertical;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.25);
    }

    .form-group input::placeholder, .form-group textarea::placeholder {
      color: #475569;
    }

    /* BOTONES */
    .btn-primary {
      width: 100%;
      min-height: 46px;
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-hover));
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-input);
      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover, .btn-primary:active {
      background: linear-gradient(135deg, var(--brand-blue-hover), #1d4ed8);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05) !important;
      color: #ffffff !important;
      border: 1.5px solid var(--border-input) !important;
      box-shadow: none !important;
    }

    .btn-secondary:hover, .btn-secondary:active {
      background-color: rgba(255, 255, 255, 0.1) !important;
      border-color: var(--brand-blue) !important;
      color: #ffffff !important;
    }

    /* CARGA MASIVA CSV */
    .csv-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
      width: 100%;
    }

    .csv-box input[type="file"] {
      width: 100%;
      padding: 10px;
      font-size: 0.85rem;
      border: 1.5px dashed var(--border-input);
      border-radius: var(--radius-input);
      background-color: var(--input-bg);
      color: var(--text-muted);
      cursor: pointer;
    }

    .csv-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    /* PRECIOS GRANEL */
    .granel-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
      width: 100%;
      background-color: var(--card-inner-bg);
      padding: 14px;
      border-radius: var(--radius-input);
      border: 1px dashed var(--border-input);
    }

    .granel-grid label {
      font-size: 0.78rem;
      margin-bottom: 3px;
      color: var(--text-muted);
    }

    .granel-grid input {
      min-height: 40px;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    /* PRESENTACIONES DINÁMICAS */
    #lista-presentaciones {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
      width: 100%;
    }

    .fila-presentacion {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--card-inner-bg);
      padding: 12px;
      border-radius: var(--radius-input);
      border: 1px solid var(--border-input);
      width: 100%;
    }

    .fila-presentacion input {
      min-height: 40px;
      background-color: var(--input-bg);
      border-radius: 8px;
    }

    .btn-quitar-presentacion {
      background: rgba(220, 38, 38, 0.15);
      color: var(--badge-red-txt);
      border: 1px solid var(--badge-red-txt);
      border-radius: var(--radius-pill);
      min-height: 38px;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.82rem;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-quitar-presentacion:hover {
      background-color: #dc2626;
      color: #ffffff;
    }

    /* FILTROS Y BUSCADORES */
    .filtros-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      width: 100%;
    }

    .filtros-box input,
    .filtros-box select {
      width: 100%;
      height: 46px;
      padding: 0 18px;
      border: 1.5px solid var(--border-input);
      border-radius: var(--radius-pill);
      background-color: var(--input-bg);
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: #ffffff;
      transition: all 0.2s ease;
      outline: none;
    }

    .filtros-box input:focus,
    .filtros-box select:focus {
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.25);
    }

    .table-responsive {
      width: 100%;
    }

    /* VISTA MÓVIL (< 768px) */
    @media (max-width: 768px) {
      .header-container {
        width: calc(100% - 20px);
        margin: 10px auto 0 auto;
        padding: 10px 14px;
        border-radius: 16px;
      }

      #user-email {
        display: none; /* Se oculta en móviles para ahorrar espacio */
      }

      .table-responsive {
        overflow-x: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead {
        display: none;
      }

      tbody {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
      }

      tr {
        display: flex;
        flex-direction: column;
        background: var(--card-inner-bg);
        border: 1px solid var(--border-input);
        border-radius: var(--radius-card);
        padding: 14px;
        gap: 8px;
        width: 100%;
        box-shadow: var(--shadow-sm);
      }

      tr.fila-agotado {
        border-left: 5px solid #ef4444;
        background-color: rgba(127, 29, 29, 0.15);
      }

      tr.fila-stock-bajo {
        border-left: 5px solid #f59e0b;
        background-color: rgba(217, 119, 6, 0.15);
      }

      td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: none;
        padding: 4px 0;
        font-size: 0.85rem;
        word-break: break-word;
        color: #ffffff;
      }

      td:first-child {
        font-family: var(--font-heading);
        font-size: 0.98rem;
        font-weight: 700;
        color: #ffffff;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border-color);
      }

      td:last-child {
        margin-top: 4px;
        padding-top: 10px;
        border-top: 1px solid var(--border-color);
      }

      .action-btns {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        width: 100%;
      }

      .btn-sm {
        min-height: 38px;
        padding: 0;
        justify-content: center;
        font-size: 0.78rem;
        width: 100%;
      }
    }

    /* VISTA ESCRITORIO (> 768px) */
    @media (min-width: 769px) {
      main { margin: 32px auto; padding: 0 20px; }
      .card { padding: 28px; }

      .form-row { flex-direction: row; gap: 16px; }
      .form-row .form-group { flex: 1; }

      .csv-box { flex-direction: row; align-items: center; }
      .csv-btns { flex-direction: row; width: auto; }
      .csv-btns button { width: auto; }

      .granel-grid { grid-template-columns: repeat(4, 1fr); }

      .filtros-box {
        flex-direction: row;
        align-items: center;
        gap: 16px;
      }
      .filtros-box input { flex: 1; }
      .filtros-box select { width: auto; min-width: 220px; }

      .fila-presentacion {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr auto;
        align-items: center;
      }

      .btn-quitar-presentacion {
        width: 36px;
        height: 36px;
        min-height: 36px;
        border-radius: 50%;
      }

      .table-responsive {
        width: 100%;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: auto;
      }

      thead {
        display: table-header-group;
      }

      tbody {
        display: table-row-group;
      }

      tr {
        display: table-row !important;
      }

      th, td {
        display: table-cell !important;
        padding: 12px 14px;
        vertical-align: middle;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.88rem;
      }

      th {
        background-color: var(--card-inner-bg);
        color: var(--text-muted);
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      th:nth-child(1), td:nth-child(1) { width: 22%; font-weight: 600; color: #ffffff; }
      th:nth-child(2), td:nth-child(2) { width: 14%; }
      th:nth-child(3), td:nth-child(3) { width: 12%; }
      th:nth-child(4), td:nth-child(4) { width: 34%; }
      th:nth-child(5), td:nth-child(5) { width: 18%; }

      tr:hover { background-color: rgba(255, 255, 255, 0.03); }
      tr.fila-agotado { background-color: rgba(127, 29, 29, 0.2); }
      tr.fila-stock-bajo { background-color: rgba(217, 119, 6, 0.2); }

      .action-btns {
        display: flex;
        flex-direction: flex-row;
        gap: 6px;
        align-items: center;
      }

      .btn-sm {
        padding: 6px 12px;
        justify-content: center;
      }
    }

    /* BADGES Y BOTONES DE ACCIÓN OSCUROS */
    .badge-cat {
      display: inline-block;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 700;
      background-color: var(--brand-blue);
      color: #ffffff;
      text-transform: uppercase;
    }

    .badge-agotado {
      display: inline-block;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 700;
      background-color: var(--badge-red-bg);
      color: var(--badge-red-txt);
      border: 1px solid var(--badge-red-txt);
      text-transform: uppercase;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .btn-edit { background: rgba(37, 99, 235, 0.2); color: #60a5fa; border: 1px solid #2563eb; }
    .btn-edit:hover, .btn-edit:active { background: #2563eb; color: #ffffff; }

    .btn-stock { background: rgba(22, 163, 74, 0.2); color: #4ade80; border: 1px solid #16a34a; }
    .btn-stock:hover, .btn-stock:active { background: #16a34a; color: #ffffff; }

    .btn-delete { background: rgba(220, 38, 38, 0.2); color: #f87171; border: 1px solid #dc2626; }
    .btn-delete:hover, .btn-delete:active { background: #dc2626; color: #ffffff; }

    /* TOAST NOTIFICACIÓN OSCURO */
    #toast-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      justify-content: center;
    }

    .toast {
      background-color: var(--card-bg);
      color: white;
      padding: 12px 24px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--brand-blue);
      box-shadow: var(--shadow-md);
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      animation: fadeIn 0.3s ease-out;
      pointer-events: auto;
      max-width: 450px;
    }

    .toast.error {
      border-color: #ef4444;
      background-color: #450a0a;
      color: #fca5a5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden { display: none !important; }

    
  </style>
</head>
<body>

  <!-- ENCABEZADO SUPERIOR FLOTANTE - TEMA IDÉNTICO AL CATÁLOGO -->
  <header class="header-container">
    <a href="catalogo.html" class="brand">
      <div class="brand-logo">Qpc</div>
      <div class="brand-text">
        <span class="brand-title">Quimiaseo y Perfumería del Caribe</span>
        <span class="brand-subtitle">Panel Administrador</span>
      </div>
    </a>

    <div class="header-actions">
      <a href="catalogo.html" class="btn-inicio">
        <i class="fa-solid fa-house"></i>
        <span>Inicio</span>
      </a>

      <div class="user-info hidden" id="user-info">
        <span id="user-email"></span>
        <button class="btn-logout" id="btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i> Salir
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- LOGIN -->
    <section id="login-section" class="login-container">
      <div class="login-title"><i class="fa-solid fa-lock"></i> Acceso Administrador</div>
      <form id="form-login">
        <div class="form-group">
          <label for="login-email">Correo Electrónico:</label>
          <input type="email" id="login-email" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña:</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary" id="btn-login-submit">
          Ingresar al Panel
        </button>
      </form>
    </section>

    <!-- PANEL DE CONTROL -->
    <section id="panel-section" class="dashboard-grid hidden">

      <h1 class="page-title"><i class="fa-solid fa-sliders" style="color: var(--brand-blue);"></i> Panel Administrador</h1>
      

      <!-- CARGA CSV -->
      <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-file-csv"></i> Carga Masiva de Productos (CSV)</h2>
        <div class="csv-box">
          <input type="file" id="input-csv" accept=".csv">
          <div class="csv-btns">
            <button type="button" class="btn-primary" id="btn-importar-csv">
              <i class="fa-solid fa-upload"></i> Importar CSV
            </button>
            <button type="button" class="btn-primary btn-secondary" id="btn-descargar-plantilla">
              <i class="fa-solid fa-download"></i> Plantilla
            </button>
          </div>
        </div>
        <p id="progreso-importacion" style="margin-top: 10px; font-size: 0.88rem; font-weight: 700; color: var(--brand-blue); text-align: center;"></p>
      </div>


      <!-- REGISTRO / EDICIÓN -->
      <div class="card">
        <h2 class="card-title" id="form-title">
          <i class="fa-solid fa-square-plus"></i> Registrar Nuevo Producto
        </h2>
        <form id="form-producto">
          <input type="hidden" id="prod-id">

          <div class="form-row">
            <div class="form-group">
              <label for="prod-nombre">Nombre del Producto:</label>
              <input type="text" id="prod-nombre" placeholder="Ej: Alcohol al 96%" required>
            </div>

            <div class="form-group">
              <label for="prod-categoria">Categoría:</label>
              <select id="prod-categoria" required>
                <option value="polvos">Polvos</option>
                <option value="liquidos">Líquidos</option>
                <option value="perfumeria">Perfumería</option>
                <option value="aromas">Aromas</option>
                <option value="sabores">Sabores</option>
                <option value="envases">Envases Plásticos</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="prod-descripcion">Descripción:</label>
              <textarea id="prod-descripcion" rows="2" placeholder="Descripción corta del producto..." required></textarea>
            </div>

            <div class="form-group">
              <label for="prod-imagen">Ruta de Imagen:</label>
              <input type="text" id="prod-imagen" placeholder="imagenes/producto.jpg">
            </div>
          </div>

          <!-- PRECIOS GRANEL -->
          <div id="grupo-precio-granel" class="form-group">
            <label><strong>Precios por Fracción:</strong></label>
            <div class="granel-grid">
              <div>
                <label for="precio-1000">1000 <span class="unidad-granel-txt">g</span>:</label>
                <input type="number" id="precio-1000" placeholder="Precio ($)">
              </div>
              <div>
                <label for="precio-500">500 <span class="unidad-granel-txt">g</span>:</label>
                <input type="number" id="precio-500" placeholder="Precio ($)">
              </div>
              <div>
                <label for="precio-250">250 <span class="unidad-granel-txt">g</span>:</label>
                <input type="number" id="precio-250" placeholder="Precio ($)">
              </div>
              <div>
                <label for="precio-125">125 <span class="unidad-granel-txt">g</span>:</label>
                <input type="number" id="precio-125" placeholder="Precio ($)">
              </div>
            </div>
          </div>

          <!-- PRESENTACIONES MANUALES -->
          <div id="grupo-presentaciones" class="form-group hidden">
            <label><strong>Presentaciones y Precios:</strong></label>
            <div id="lista-presentaciones"></div>
            <button type="button" id="btn-agregar-presentacion" class="btn-sm btn-edit" style="width: 100%; justify-content: center; margin-top: 8px; min-height: 40px;">
              <i class="fa-solid fa-plus"></i> Agregar opción
            </button>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="prod-stock">Stock total (<span id="unidad-stock-txt">unid.</span>) — Vacío = ilimitado:</label>
              <input type="number" id="prod-stock" step="0.01" min="0" placeholder="Ej: 50">
            </div>

            <div class="form-group">
              <label for="prod-stock-minimo">Stock mínimo (<span id="unidad-stock-minimo-txt">unid.</span>):</label>
              <input type="number" id="prod-stock-minimo" step="0.01" min="0" placeholder="Ej: 5">
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
            <button type="submit" class="btn-primary" id="btn-guardar-prod">
              Guardar Producto
            </button>

            <button type="button" class="btn-primary btn-secondary hidden" id="btn-cancelar-edit">
              Cancelar
            </button>
          </div>
        </form>
      </div>

      <!-- TABLA DE INVENTARIO Y FILTROS -->
      <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-boxes-stacked"></i> Productos en Inventario</h2>
        
        <div class="filtros-box">
          <input type="text" id="filtro-buscar" placeholder="🔍 Buscar producto por nombre...">
          <select id="filtro-categoria">
            <option value="">Todas las categorías</option>
            <option value="polvos">Polvos</option>
            <option value="liquidos">Líquidos</option>
            <option value="perfumeria">Perfumería</option>
            <option value="aromas">Aromas</option>
            <option value="sabores">Sabores</option>
            <option value="envases">Envases Plásticos</option>
          </select>
        </div>

        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Stock</th>
                <th>Presentaciones / Precios</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-productos-body">
              <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Cargando productos...</td></tr>
            </tbody>
          </table>
          <div id="paginacion" style="display:flex; justify-content:center; align-items:center; margin-top:15px;"></div>
        </div>
      </div>

    </section>
  </main>

  <div id="toast-container"></div>

  <script type="module" src="admin.js"></script>
</body>
</html>
